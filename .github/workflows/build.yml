name: Build

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    name: Build Application
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Display .NET Info
        run: dotnet --info

      - name: Restore
        run: dotnet restore DeformationEngine/DeformationEngine.slnx

      - name: Build (Release)
        run: dotnet build DeformationEngine/DeformationEngine.slnx `
             --configuration Release `
             --no-restore
